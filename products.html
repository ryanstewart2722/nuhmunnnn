<style>
:root { --edge: 20px; }
@font-face {
  font-family: 'ABCDiatype';
  src: url('./fonts/ABCDiatype-Regular.otf') format('opentype');
  font-weight: normal; font-style: normal;
}
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  border: 0 none; outline: 0 none;
  -webkit-tap-highlight-color: transparent;
}

/*
  No position:fixed anywhere — fixed elements force GPU compositing layers
  which produce tile-seam artifacts on Retina displays in Safari.
  Everything is position:absolute within a body that fills the viewport.
*/
html {
  width: 100%; height: 100%;
  background: #D9D9D9;
  overflow: hidden;
}
body {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #D9D9D9;
  overflow: hidden;
  cursor: none;
  transition: background-color 0.8s ease;
  font-family: 'ABCDiatype', Arial, sans-serif;
}

/* Party mode */
@keyframes hue-cycle { 0% { color: hsl(0,42%,67%); } 44% { color: hsl(158,42%,67%); } 55% { color: hsl(222,42%,67%); } 100% { color: hsl(360,42%,67%); } }
#nav-center:hover { animation: hue-cycle 1.5s linear infinite; opacity: 1 !important; }
#party-toggle { background: none; border: none; padding: 0; cursor: pointer; color: #1a1a1a; opacity: 0.45; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); line-height: 0; }
#party-toggle:hover { animation: hue-cycle 1.5s linear infinite; opacity: 1; }
body.party #party-toggle { animation: hue-cycle 1.5s linear infinite; opacity: 1; }

/* Frame — all 4 strips always fixed */
#bl { position: fixed; top: 0; left: 0; bottom: 0; width: 15px; background: #D9D9D9; z-index: 950; pointer-events: none; transition: background-color 1.2s ease; }
#br { position: fixed; top: 0; right: 0; bottom: 0; width: 15px; background: #D9D9D9; z-index: 950; pointer-events: none; transition: background-color 1.2s ease; }
#nav {
  position: fixed; top: 0; left: 0; right: 0; height: 28px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 15px; background: #D9D9D9; z-index: 200; cursor: auto;
  transition: background-color 1.2s ease;
}
#nav a { font-family: 'ABCDiatype', Arial, sans-serif; font-size: 12px; color: #1a1a1a; text-decoration: none; }
#nav a:hover { opacity: 0.5; }
#nav-center {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-family: 'ABCDiatype', Arial, sans-serif; font-size: 14px; color: #1a1a1a;
}
#footer {
  position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: #D9D9D9; z-index: 200; cursor: auto;
  font-family: 'ABCDiatype', Arial, sans-serif; font-size: 12px; color: #1a1a1a;
  transition: background-color 1.2s ease;
}
#status-bar { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; }

/* Scroll area — absolute, clips the canvas */
#clip {
  position: absolute;
  top: 28px; bottom: 28px; left: 15px; right: 15px;
  overflow: hidden;
  background: #ffffff;
}

/* Canvas — positioned at 0,0; all movement via transform translate+scale */
#canvas {
  position: absolute;
  left: 0; top: 0;
  transform-origin: 0 0;
  background: #ffffff;
  transition: transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94),
              opacity 0.35s ease;
}
#canvas.instant { transition: none; }

/* In overview (cat) mode: show meta for all cards */
#canvas.cat-view .card-rule,
#canvas.cat-view .card-meta  { opacity: 1; }
#canvas.cat-view .card-link  { display: none !important; }

.card {
  position: absolute;
  background: transparent;
}

/* Link overlay */
.card-link {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 10; display: none; cursor: none;
}
.card-link.active { display: block; cursor: none; }

.card-img {
  position: absolute;
  top: 0; left: 0;
  overflow: hidden;
  background-size: calc(100% + 4px) calc(100% + 4px);
  background-repeat: no-repeat;
  background-position: center;
  background-color: transparent;
}

/* 1px black rule — positioned absolutely below image */
.card-rule {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: #000;
}

/* Meta text */
.card-meta {
  position: absolute;
  left: 0; right: 0;
  display: flex; align-items: baseline;
  font-family: 'ABCDiatype', Arial, sans-serif;
  font-size: 12px; color: #1a1a1a;
  line-height: 1; white-space: nowrap;
  padding-top: 5px;
  background: transparent;
}
.card-meta .m-name   { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.card-meta .m-year   { flex: 0 0 auto; margin-right: 14px; }
.card-meta .m-client { flex: 0 0 auto; }

/* Gallery: only focused card shows rule + meta */
#canvas .card-rule,
#canvas .card-meta {
  opacity: 0;
  transition: opacity 0.2s ease;
}
#canvas .card.focused .card-rule,
#canvas .card.focused .card-meta {
  opacity: 1;
}

/* Cursors */
body, body * { cursor: none !important; }
#cursor-wrap {
  position: absolute; pointer-events: none; z-index: 999;
  transform: translate(-50%,-50%); display: none;
  font-family: 'ABCDiatype', Arial, sans-serif;
  font-size: 12px; line-height: 1; color: rgba(0,0,0,0.75);
  background: rgba(236,236,236,0.72);
  border: 1px solid #d1d1d1;
  border-radius: 100px;
  padding: 5px 11px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  white-space: nowrap;
  user-select: none; -webkit-user-select: none;
}
/* ── "View" cursor for catalogue ── */
#cat-cursor {
  position: absolute; pointer-events: none; z-index: 9999;
  transform: translate(-50%, -50%); display: none;
  font-family: 'ABCDiatype', Arial, sans-serif; font-size: 24px;
  color: #fff; mix-blend-mode: exclusion;
  white-space: nowrap; line-height: 1;
  user-select: none; -webkit-user-select: none;
  transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
}

/* ── Gallery | Catalogue tab toggle ── */




/* ── View toggle (fixed top-left, aligned to grid margin) ── */
#view-toggle {
  position: fixed;
  left: calc(15px + 1.7vw); top: 50px;
  display: flex; align-items: center; gap: 7px;
  background: rgba(236,236,236,0.6);
  border: 1px solid #d1d1d1;
  border-radius: 100px;
  padding: 4px 10px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 500;
  cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
.vt-label {
  font-family: 'ABCDiatype', Arial, sans-serif;
  font-size: 12px; color: rgba(0,0,0,0.45);
  cursor: pointer;
  transition: color 0.15s ease;
  white-space: nowrap;
}
.vt-label.active { color: #000; }
.vt-label:hover  { opacity: 0.7; }

/* ── Project view overlay ── */
#pv-overlay {
  position: absolute; inset: 0;
  background: #fff;
  display: none;
  overflow-y: scroll; overflow-x: hidden;
  scrollbar-width: none; -ms-overflow-style: none;
  z-index: 400; cursor: auto;
}
#pv-overlay::-webkit-scrollbar { display: none; }
#pv-overlay.visible { display: block; }
#pv-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  column-gap: 1.42%;
  row-gap: 130px;
  padding: 95px 1.7% 0;
}
.pv-slot {
  position: relative;
  min-width: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.pv-img-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
}
.pv-img-default {
  width: 100%;
  display: block;
  background-size: cover;
  background-position: center;
}
.pv-img-hover-layer {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.pv-slot:hover .pv-img-hover-layer { opacity: 1; }
.pv-rule { width: 100%; height: 1px; background: #000; display: block; margin-top: 9px; }
.pv-meta {
  display: flex; align-items: baseline;
  font-family: 'ABCDiatype', Arial, sans-serif;
  font-size: 12px; color: #1a1a1a;
  line-height: 1; white-space: nowrap; overflow: hidden;
  padding: 4px 0 0;
}
.pv-meta .m-name   { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.pv-meta .m-year   { flex: 0 0 auto; margin-right: 14px; }
.pv-meta .m-client { flex: 0 0 auto; }

/* ── Mobile: simple single-column scroll ── */
#mobile-layout { display: none; }

@media (max-width: 768px) {
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    cursor: auto;
  }

  body {
    position: relative;
    top: auto; left: auto; right: auto; bottom: auto;
    background: #D9D9D9;
    padding: 28px 0;
  }

  #nav    { position: fixed; top: 0; left: 0; right: 0; z-index: 200; }
  #footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; }
  /* #bl and #br stay visible on all screen sizes */

  #nav a, #nav-center { cursor: auto; }
  #clip, #cursor-wrap, #cursor-dot { display: none !important; }

  #mobile-layout {
    display: block;
    background: #ffffff;
    height: calc(100vh - 56px);
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    margin: 0 15px;
    padding: 0 10px;
  }
  #mobile-layout::-webkit-scrollbar { display: none; }

  .m-card { width: 100%; display: block; background: transparent; text-decoration: none; color: inherit; }

  .m-card-img {
    width: 100%;
    height: 0;
  padding-bottom: calc(1399 / 1043 * 100%);
  position: relative;
    overflow: hidden;
    background-color: #ffffff;
    background-size: calc(100% + 4px) calc(100% + 4px);
    background-position: center;
    background-repeat: no-repeat;
    display: block;
  }

  .m-card-rule { width: 100%; height: 1px; background: #000; display: block; }

  .m-card-meta {
    display: flex; align-items: baseline;
    font-family: 'ABCDiatype', Arial, sans-serif;
    font-size: 12px; color: #1a1a1a;
    line-height: 1; white-space: nowrap;
    padding: 5px 0 32px;
  }
  .m-card-meta .m-name   { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .m-card-meta .m-year   { flex: 0 0 auto; margin-right: 14px; }
  .m-card-meta .m-client { flex: 0 0 auto; }
}

  VH = clip.clientHeight;

  imgH  = Math.round(cardW * IMG_RATIO);

function buildGrid() {

  canvas.style.width  = (COLS*cardW + (COLS-1)*GAP) + 'px';
  canvas.style.height = (ROWS*cardH + (ROWS-1)*GAP) + 'px';

  for (let i = 0; i < COLS*ROWS; i++) {
    const p   = projects[i];
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    const L   = col*(cardW+GAP);
    const T   = row*(cardH+GAP);

    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = 'left:'+L+'px;top:'+T+'px;width:'+cardW+'px;height:'+cardH+'px;';

    const link = document.createElement('a');
    link.className = 'card-link';
    if (p.name !== 'Confidential') {
      link.href = (p.client && p.client.includes('Pax')) ? 'pax-project.html' : 'flaus-project.html';
    }
    link.id = 'cl' + i;
    card.appendChild(link);

    const imgDiv = document.createElement('div');
    imgDiv.className = 'card-img';
    imgDiv.style.cssText = 'width:'+cardW+'px;height:'+imgH+'px;background-image:url('+JSON.stringify(p.img)+');';
    card.appendChild(imgDiv);

    const rule = document.createElement('div');
    rule.className = 'card-rule';
    rule.style.top = imgH + 'px';
    card.appendChild(rule);

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.style.top = (imgH+1) + 'px';
    meta.style.height = META_H + 'px';
    meta.innerHTML = '<span class="m-name">'+p.name+'</span><span class="m-year">'+p.year+'</span><span class="m-client">'+p.client+'</span>';
    card.appendChild(meta);

    canvas.appendChild(card);
  }
  updateLink();
}

function updateLink() {
  document.querySelectorAll('.card-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.card').forEach(c => c.classList.remove('focused'));
  const l = document.getElementById('cl' + (focusRow*COLS + focusCol));
  if (l) {
    l.classList.add('active');
    if (l.parentElement) l.parentElement.classList.add('focused');
  }
}

function getCatZoom() {
  const cW = COLS*cardW + (COLS-1)*GAP;
  const cH = ROWS*cardH + (ROWS-1)*GAP;
  return Math.min((VW - 2*CAT_PAD) / cW, (VH - 2*CAT_PAD) / cH);
}

function getPos() {
  if (catMode) {
    const cW = COLS*cardW + (COLS-1)*GAP;
    const cH = ROWS*cardH + (ROWS-1)*GAP;
    const s  = getCatZoom();
    return { tx: Math.round((VW - cW*s) / 2), ty: Math.round((VH - cH*s) / 2), scale: s };
  }
  const xC = focusCol*(cardW+GAP) + cardW/2;
  const yC = focusRow*(cardH+GAP) + imgH/2;
  return { tx: Math.round(VW/2 - xC), ty: Math.round(VH/2 - yC), scale: zoomLevel };
}

function applyPos(animated) {
  const { tx, ty, scale } = getPos();
  canvas.classList.toggle('instant', !animated);
  if (!animated) canvas.offsetHeight;
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

function setZoom(level) {
  zoomLevel = level;
  applyPos(true);
}

function navTo(dir) {
  if (!dir) return;
  const { dr, dc } = DIRS[dir];
  if (dr < 0 && focusRow > 0)      focusRow--;
  if (dr > 0 && focusRow < ROWS-1) focusRow++;
  if (dc < 0 && focusCol > 0)      focusCol--;
  if (dc > 0 && focusCol < COLS-1) focusCol++;
  applyPos(true); updateLink();
}

function navOpacity(dir) {
  const { dr, dc } = DIRS[dir];
  const rowOk = (dr === 0) || (dr < 0 ? focusRow > 0 : focusRow < ROWS-1);
  const colOk = (dc === 0) || (dc < 0 ? focusCol > 0 : focusCol < COLS-1);
  if (rowOk && colOk) return 1;
  if (dr !== 0 && dc !== 0 && (rowOk || colOk)) return 0.5;
  return 0;
}

function nearScreenEdge(mx, my, dir) {
  const r = clip.getBoundingClientRect();
  const { dr, dc } = DIRS[dir];
  const T = 0.12;
  if (dr < 0 && (my - r.top)    < r.height * T) return true;
  if (dr > 0 && (r.bottom - my) < r.height * T) return true;
  if (dc < 0 && (mx - r.left)   < r.width  * T) return true;
  if (dc > 0 && (r.right - mx)  < r.width  * T) return true;
  return false;
}

function getZone(mx, my) {
  const r  = clip.getBoundingClientRect();
  const dx = mx - (r.left + r.width  / 2);
  const dy = my - (r.top  + r.height / 2);
  if (Math.sqrt(dx*dx + dy*dy) < Math.min(r.width, r.height) * 0.04) return null;
  const a = Math.atan2(dy, dx) * 180 / Math.PI;
  if (a > -15  && a <= 15)   return 'right';
  if (a > 15   && a <= 50)   return 'down-right';
  if (a > 50   && a <= 130)  return 'down';
  if (a > 130  && a <= 165)  return 'down-left';
  if (a > 165  || a <= -165) return 'left';
  if (a > -165 && a <= -130) return 'up-left';
  if (a > -130 && a <= -50)  return 'up';
  return 'up-right';
}

// ── View mode switching ───────────────────────────────────────

function setViewMode(mode) {
  if (mode === 'catalogue') { zoomToCatalogue(); } else { zoomToGallery(focusRow * COLS + focusCol); }
}

function zoomToGallery(index) {
  focusRow = Math.floor(index / COLS);
  focusCol = index % COLS;
  catMode  = false;
  canvas.classList.remove('cat-view');
  applyPos(true);
  updateLink();
  catCursor.style.display = 'none';
  requestAnimationFrame(() => {
    catCursor.style.transform = 'translate(-50%,-50%) rotate(45deg)';
  });
}

function zoomToCatalogue() {
  catMode = true;
  canvas.classList.add('cat-view');
  applyPos(true);
  updateLink();
  cursorWrap.style.display = 'none';
  catCursor.style.display  = 'none';
  requestAnimationFrame(() => {
    catCursor.style.transform = 'translate(-50%,-50%) rotate(0deg)';
  });
}

// ── View mode (Product / Project overlay) ─────────────────────
let pvMode = false;

function buildProjectView() {
  const grid = document.getElementById('pv-grid');
  if (!grid) return;
  grid.innerHTML = '';
  const oldEnd = document.getElementById('pv-end');
  if (oldEnd) oldEnd.remove();
  pvLayout.forEach(function(row) {
    row.forEach(function(slot) {
      const el = document.createElement('div');
      el.style.gridColumn = 'span ' + slot.cols;
      if (slot.i === undefined) { grid.appendChild(el); return; }
      const p = pvImages[slot.i];
      el.className = 'pv-slot';
      const wrap = document.createElement('div');
      wrap.className = 'pv-img-wrap';
      const def = document.createElement('div');
      def.className = 'pv-img-default';
      def.style.paddingBottom = (slot.ratio * 100).toFixed(2) + '%';
      def.style.backgroundImage = 'url(' + JSON.stringify(p.src) + ')';
      const hov = document.createElement('div');
      hov.className = 'pv-img-hover-layer';
      hov.style.backgroundImage = 'url(' + JSON.stringify(p.hover) + ')';
      wrap.appendChild(def);
      wrap.appendChild(hov);
      const rule = document.createElement('div');
      rule.className = 'pv-rule';
      const meta = document.createElement('div');
      meta.className = 'pv-meta';
      meta.innerHTML = '<span class="m-name">' + p.name + '</span><span class="m-year">' + p.year + '</span><span class="m-client">' + p.client + '</span>';
      el.appendChild(wrap);
      el.appendChild(rule);
      el.appendChild(meta);
      grid.appendChild(el);
    });
  });
  const end = document.createElement('div');
  end.id = 'pv-end';
  end.style.height = '60px';
  grid.parentNode.appendChild(end);
}

function layoutPv() {}

function setPvMode(on) {
  pvMode = on;
  const overlay = document.getElementById('pv-overlay');
  if (overlay) overlay.classList.toggle('visible', on);
  document.getElementById('vt-product').classList.toggle('active', !on);
  document.getElementById('vt-project').classList.toggle('active',  on);
  cursorWrap.style.display = 'none';
  cursorDot.style.display  = 'none';
  if (on) {
    const slots = document.querySelectorAll('.pv-slot');
    slots.forEach(function(slot) {
      slot.style.opacity = '0';
      slot.style.transitionDelay = '0ms';
    });
    requestAnimationFrame(function() {
      slots.forEach(function(slot) {
        const delay = Math.random() * 600;
        slot.style.transitionDelay = delay + 'ms';
        slot.style.opacity = '1';
      });
    });
  }
}

document.addEventListener('mousemove', e => {
  if (pvMode) return;

  if (catMode) {
    const r = clip.getBoundingClientRect();
    const ins = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!ins) { catCursor.style.display = 'none'; return; }
    const { tx, ty, scale } = getPos();
    const cx = (e.clientX - r.left - tx) / scale;
    const cy = (e.clientY - r.top  - ty) / scale;
    const col = Math.floor(cx / (cardW+GAP));
    const row = Math.floor(cy / (cardH+GAP));
    const onCard = col >= 0 && col < COLS && row >= 0 && row < ROWS &&
                   (cx - col*(cardW+GAP)) <= cardW && (cy - row*(cardH+GAP)) <= imgH;
    if (onCard) {
      const hoveredProject = projects[row * COLS + col];
      if (hoveredProject && hoveredProject.name === 'Confidential') {
        cursorWrap.textContent = 'Confidential';
        cursorWrap.style.left    = e.clientX + 'px';
        cursorWrap.style.top     = e.clientY + 'px';
        cursorWrap.style.opacity = '1';
        cursorWrap.style.display = 'block';
        catCursor.style.display  = 'none';
      } else {
        catCursor.textContent = '+';
        catCursor.style.transform = 'translate(-50%,-50%) rotate(0deg)';
        catCursor.style.left = e.clientX + 'px';
        catCursor.style.top  = e.clientY + 'px';
        catCursor.style.display = 'block';
        cursorWrap.style.display = 'none';
      }
    } else {
      catCursor.style.display  = 'none';
      cursorWrap.style.display = 'none';
    }
    cursorDot.style.display  = 'none';
    return;
  }

  const r   = clip.getBoundingClientRect();
  const ins = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;

  // Outside clip — hide custom cursors but keep OS cursor hidden in gallery mode
  if (!ins) {
    cursorWrap.style.display = 'none';
    catCursor.style.display  = 'none';
    hoverDir = null;
    return;
  }

  // Check if over the focused card (full image hit zone)
  const focusedProject = projects[focusRow * COLS + focusCol];
  const isLink         = focusedProject && focusedProject.name !== 'Confidential';
  const isConfidential = focusedProject && focusedProject.name === 'Confidential';
  if (isLink || isConfidential) {
    const cr = canvas.getBoundingClientRect();
    const cardL = cr.left + focusCol * (cardW + GAP);
    const cardT = cr.top  + focusRow * (cardH + GAP);
    if (e.clientX >= cardL && e.clientX <= cardL + cardW &&
        e.clientY >= cardT && e.clientY <= cardT + imgH) {
      cursorWrap.textContent = isConfidential ? 'Confidential' : 'View More';
      cursorWrap.style.left    = e.clientX + 'px';
      cursorWrap.style.top     = e.clientY + 'px';
      cursorWrap.style.opacity = '1';
      cursorWrap.style.display = 'block';
      catCursor.style.display  = 'none';
      hoverDir = null;
      return;
    }
  }

  // Edge-proximity arrows or × in center

  const r2    = clip.getBoundingClientRect();
  const EDGE  = 20;
  const nearL = (e.clientX - r2.left)   < EDGE && focusCol > 0;
  const nearR = (r2.right  - e.clientX) < EDGE && focusCol < COLS - 1;
  const nearT = (e.clientY - r2.top)    < EDGE && focusRow > 0;
  const nearB = (r2.bottom - e.clientY) < EDGE && focusRow < ROWS - 1;

  let arrowDir = null;
  if      (nearL) arrowDir = 'left';
  else if (nearR) arrowDir = 'right';
  else if (nearT) arrowDir = 'up';
  else if (nearB) arrowDir = 'down';

  hoverDir = arrowDir;
  const ARROW_CHARS = { left: '←', right: '→', up: '↑', down: '↓' };
  catCursor.textContent = arrowDir ? ARROW_CHARS[arrowDir] : '+';
  catCursor.style.transform = arrowDir
    ? 'translate(-50%, -50%)'
    : 'translate(-50%, -50%) rotate(45deg)';
  catCursor.style.left    = e.clientX + 'px';
  catCursor.style.top     = e.clientY + 'px';
  catCursor.style.display = 'block';
  cursorWrap.style.display = 'none';
});

clip.addEventListener('click', e => {
  if (pvMode) return;
  if (catMode) {
    const r = clip.getBoundingClientRect();
    const { tx, ty, scale } = getPos();
    const cx = (e.clientX - r.left - tx) / scale;
    const cy = (e.clientY - r.top  - ty) / scale;
    const col = Math.floor(cx / (cardW+GAP));
    const row = Math.floor(cy / (cardH+GAP));
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    if ((cx - col*(cardW+GAP)) > cardW || (cy - row*(cardH+GAP)) > imgH) return;
    const idx = row * COLS + col;
    if (idx < projects.length) zoomToGallery(idx);
    return;
  }
  // Check focused card hit zone first (full image area)
  const focusedProject = projects[focusRow * COLS + focusCol];
  const isLink         = focusedProject && focusedProject.name !== 'Confidential';
  const isConfidential = focusedProject && focusedProject.name === 'Confidential';
  if (isLink || isConfidential) {
    const cr = canvas.getBoundingClientRect();
    const cardL = cr.left + focusCol * (cardW + GAP);
    const cardT = cr.top  + focusRow * (cardH + GAP);
    if (e.clientX >= cardL && e.clientX <= cardL + cardW &&
        e.clientY >= cardT && e.clientY <= cardT + imgH) {
      if (isLink) {
        const l = document.getElementById('cl' + (focusRow * COLS + focusCol));
        if (l && l.href) { window.location.href = l.href; }
      }
      return;
    }
  }
  // Directional arrow zone → navigate
  if (hoverDir !== null) { navTo(hoverDir); return; }
  // Gap / exit zone → back to catalogue
  zoomToCatalogue();
});

document.addEventListener('mouseleave', () => {
  cursorWrap.style.display = 'none';
  catCursor.style.display  = 'none';
});

document.addEventListener('keydown', e => {
  if (e.key === '-') { e.preventDefault(); setViewMode('catalogue'); return; }
  if (e.key === '+' || e.key === '=') { e.preventDefault(); setViewMode('gallery');   return; }
  if (catMode) return;
  const m = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (m[e.key]) { navTo(m[e.key]); }
  if (e.key === 'Enter') { const l = document.getElementById('cl' + (focusRow*COLS + focusCol)); if (l && l.href) window.location.href = l.href; }
});

// ── Trackpad swipe navigation ─────────────────────────────
let swipeLocked = false;
let swipeAccX = 0, swipeAccY = 0;
const SWIPE_THRESHOLD = 80;

clip.addEventListener('wheel', e => {
  if (catMode) return;
  if (pvMode) return;
  e.preventDefault();

  swipeAccX += e.deltaX;
  swipeAccY += e.deltaY;

  if (swipeLocked) return;

  const ax = Math.abs(swipeAccX), ay = Math.abs(swipeAccY);
  if (ax < SWIPE_THRESHOLD && ay < SWIPE_THRESHOLD) return;

  let dir;
  if (ax >= ay) {
    dir = swipeAccX > 0 ? 'right' : 'left';
  } else {
    dir = swipeAccY > 0 ? 'down' : 'up';
  }

  swipeAccX = 0; swipeAccY = 0;
  swipeLocked = true;
  navTo(dir);
  setTimeout(() => { swipeLocked = false; swipeAccX = 0; swipeAccY = 0; }, 900);
}, { passive: false });


function buildMobileLayout() {
  const container = document.getElementById('mobile-layout');
  container.innerHTML = '';
  // Use unique products only for mobile (skip duplicates)
  const seen = new Set();
  projects.forEach(p => {
    if (seen.has(p.img)) return;
    seen.add(p.img);

    const link = document.createElement('a');
    link.className = 'm-card';
    link.href = (p.client && p.client.includes('Pax')) ? 'pax-project.html' : 'flaus-project.html';

    const imgDiv = document.createElement('div');
    imgDiv.className = 'm-card-img';
    imgDiv.style.backgroundImage = 'url(' + JSON.stringify(p.img) + ')';

    const rule = document.createElement('div');
    rule.className = 'm-card-rule';

    const meta = document.createElement('div');
    meta.className = 'm-card-meta';
    meta.innerHTML =
      '<span class="m-name">'   + p.name   + '</span>' +
      '<span class="m-year">'   + p.year   + '</span>' +
      '<span class="m-client">' + p.client + '</span>';

    link.appendChild(imgDiv);
    link.appendChild(rule);
    link.appendChild(meta);
    container.appendChild(link);
  });
}

let pvBuilt = false;
function init() {
  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  if (isMobile) { buildMobileLayout(); return; }
  measure(); buildGrid(); applyPos(false);
  if (!pvBuilt) {
    buildProjectView();
    pvBuilt = true;
  } else {
    layoutPv();
  }
}
window.addEventListener('resize', init);
init();
zoomToCatalogue();

// ── View toggle listeners ──
document.getElementById('vt-product').addEventListener('click', () => setPvMode(false));
document.getElementById('vt-project').addEventListener('click', () => setPvMode(true));

// ── Party mode ──
(function() {
  const KEY = 'naman-party';
  const BANNED = [[160, 220]];
  let lastH = -1, _interval = null;
  function nextPastel() {
    let h;
    do { h = Math.floor(Math.random() * 360); }
    while (Math.abs(h - lastH) < 40 || BANNED.some(([a,b]) => h >= a && h <= b));
    lastH = h;
    return `hsl(${h},${35 + Math.floor(Math.random() * 20)}%,${62 + Math.floor(Math.random() * 10)}%)`;
  }
  function setParty(on) {
    document.body.classList.toggle('party', on);
    localStorage.setItem(KEY, on ? '1' : '0');
    if (on) {
      const applyColor = () => { const c = nextPastel(); ['bl','br','nav','footer'].forEach(id => { const el = document.getElementById(id); if (el) el.style.backgroundColor = c; }); };
      applyColor();
      _interval = setInterval(applyColor, 2000);
    } else {
      clearInterval(_interval); _interval = null;
      ['bl','br','nav','footer'].forEach(id => { const el = document.getElementById(id); if (el) el.style.backgroundColor = ''; });
    }
  }
  if (localStorage.getItem(KEY) === '1') { setParty(true); }
  document.getElementById('party-toggle').addEventListener('click', () => setParty(!document.body.classList.contains('party')));
})();
